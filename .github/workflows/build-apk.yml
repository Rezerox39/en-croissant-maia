name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13846066"
          echo "ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Install Meson
        run: pip install meson ninja

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build lc0 engine for Android
        run: bash scripts/build-lc0-android.sh

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Build APK
        env:
          CC_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB_aarch64_linux_android: ${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
        run: pnpm tauri android build --apk --target aarch64

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_PASS" ]; then
            echo "ANDROID_KEYSTORE_PASS secret not set; generating a throwaway keystore" >&2
            ANDROID_KEYSTORE_PASS="maia-1700-demo"
          fi
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias en-croissant-maia             -keyalg RSA -keysize 2048 -validity 10000             -storepass "$ANDROID_KEYSTORE_PASS" -keypass "$ANDROID_KEYSTORE_PASS"             -dname "CN=En Croissant Maia, O=Rezerox39, C=US" > /dev/null 2>&1
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)"
          SIGNED="${UNSIGNED%-unsigned.apk}.apk"
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner sign             --ks "$KEYSTORE"             --ks-pass "pass:$ANDROID_KEYSTORE_PASS"             --key-pass "pass:$ANDROID_KEYSTORE_PASS"             --out "$SIGNED" "$UNSIGNED"
          echo "Signed APK: $SIGNED ($(du -h "$SIGNED" | cut -f1))"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-maia-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
